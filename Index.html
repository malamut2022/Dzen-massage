<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дзен Массаж</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#49334c;background:#f8f3f6}*{box-sizing:border-box}body{margin:0}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff}header{background:linear-gradient(135deg,#eee0ef,#f7eadd);padding:24px 18px}h1{margin:0;color:#6d4771;letter-spacing:3px}h2{font-size:21px}main{padding:18px}.sub{color:#866e84}.tabs,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid.three{grid-template-columns:repeat(3,1fr)}button,input,select{font:inherit}button{border:1px solid #c9aecb;border-radius:12px;background:white;padding:12px;color:#604264;cursor:pointer}button.primary{background:#88608e;color:white;border-color:#88608e}button:disabled{opacity:.3;cursor:not-allowed}button.active{background:#88608e;color:#fff}.wide{width:100%;margin:7px 0}.panel{border:1px solid #e9dce8;border-radius:14px;padding:14px;margin:12px 0}.small{font-size:13px;color:#806d80}input,select{width:100%;padding:12px;border:1px solid #d7c4d5;border-radius:10px;margin:8px 0}label{display:block;margin-top:10px}footer{padding:16px 18px}#note{font-size:12px;color:#866e84;margin-top:18px}</style></head><body><div class="app"><header><h1>✿ ДЗЕН МАССАЖ</h1><div class="sub">Екатерина · запись на массаж</div></header><main><div class="tabs"><button id="clientTab" onclick="setRole('client')">Клиент</button><button id="adminTab" onclick="setRole('admin')">Екатерина</button></div><div id="content"></div><div id="note">Демонстрационная версия: данные сохраняются только в этом браузере. Реальные уведомления и Telegram пока не подключены. Кабинет Екатерины в демо открыт без пароля.</div></main><footer><button class="wide" onclick="home()">⌂ В главное меню</button></footer></div><script>
const services=['Проработка мышц','Релакс-массаж','Лимфодренажный массаж','Баночный массаж','Массаж шейно-воротниковой зоны','Массаж бамбуковым веником','Другие техники'];const slots=['10:00','11:30','13:00','14:30','16:00','17:30'];const today=new Date();today.setHours(0,0,0,0);const days=Array.from({length:21},(_,i)=>{let d=new Date(today);d.setDate(d.getDate()+i);return {id:d.toISOString().slice(0,10),label:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',weekday:'short'})}});const read=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};let bookings=read('dm_bookings',[]),closed=read('dm_closed',[]),blocked=read('dm_blocked',[]),durations=read('dm_durations',[60,60,75,45,30,60,60]);let role='client',page='home',service=0,day=days[0].id,selected='',adminDay=days[0].id;const save=()=>{localStorage.setItem('dm_bookings',JSON.stringify(bookings));localStorage.setItem('dm_closed',JSON.stringify(closed));localStorage.setItem('dm_blocked',JSON.stringify(blocked));localStorage.setItem('dm_durations',JSON.stringify(durations))};const el=()=>document.getElementById('content');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const free=(d,t,s)=>!closed.includes(d)&&!blocked.includes(d+'|'+t)&&mins(t)+durations[s]<=19*60&&!bookings.some(b=>b.day===d&&mins(t)<mins(b.time)+durations[b.service]+20&&mins(b.time)<mins(t)+durations[s]+20);const goto=p=>{page=p;selected='';render()};const home=()=>goto('home');const setRole=r=>{role=r;home()};const dates=(value,fn)=>`<select onchange="${fn}(this.value)">${days.map(d=>`<option value="${d.id}" ${d.id===value?'selected':''}>${d.label}</option>`).join('')}</select>`;
function render(){document.getElementById('clientTab').className=role==='client'?'active':'';document.getElementById('adminTab').className=role==='admin'?'active':'';let h='';if(page==='home'){h=role==='client'?`<h2>Уважаемые клиенты, здравствуйте!</h2><p>Меня зовут Екатерина. Приглашаю вас уделить время себе, расслабиться и восстановить силы.</p><button class="primary wide" onclick="goto('services')">📅 Записаться</button><button class="wide" onclick="goto('my')">Мои записи</button><button class="wide" onclick="goto('services')">Услуги</button><button class="wide" onclick="alert('Телефон Екатерины: +7 999 103-10-77')">Связаться с Екатериной</button>`:`<h2>Кабинет Екатерины</h2><p>Всего записей: <b>${bookings.length}</b></p><button class="primary wide" onclick="goto('schedule')">Управление расписанием</button><button class="wide" onclick="goto('all')">Записи клиентов</button><button class="wide" onclick="goto('durations')">Длительность услуг</button>`}else if(page==='services'){h='<h2>Выберите услугу</h2>'+services.map((s,i)=>`<button class="wide" onclick="service=${i};goto('calendar')">${esc(s)} · ${durations[i]} мин →</button>`).join('')}else if(page==='calendar'){h=`<h2>Дата и время</h2><p>${esc(services[service])} · ${durations[service]} мин</p>${dates(day,'setDay')}<div class="grid three">${slots.map(t=>`<button ${free(day,t,service)?'':'disabled'} class="${selected===t?'active':''}" onclick="selected='${t}';render()">${t}</button>`).join('')}</div><p class="small">20 минут между сеансами учтены автоматически.</p>${selected?`<label>Ваше имя<input id="clientName" placeholder="Имя"></label><button class="primary wide" onclick="book()">Подтвердить запись</button>`:''}`}else if(page==='my'||page==='all'){const bs=page==='all'?bookings:bookings.filter(b=>b.owner===getOwner());h=`<h2>${page==='my'?'Мои записи':'Записи клиентов'}</h2>`+(bs.length?bs.map(b=>`<div class="panel"><b>${esc(services[b.service])}</b><p>${esc(b.day)} · ${esc(b.time)} · ${durations[b.service]} мин</p><p>${esc(b.name)}</p><button onclick="cancel('${b.id}')">Отменить запись</button></div>`).join(''):'<p>Записей пока нет.</p>')}else if(page==='schedule'){h=`<h2>Управление расписанием</h2>${dates(adminDay,'setAdminDay')}<button class="wide" onclick="toggleDay()">${closed.includes(adminDay)?'Открыть день':'Закрыть весь день'}</button><p>Отдельные часы:</p><div class="grid three">${slots.map(t=>{const off=blocked.includes(adminDay+'|'+t);return `<button class="${off?'active':''}" onclick="toggleSlot('${t}')">${t} ${off?'×':'✓'}</button>`}).join('')}</div><p class="small">× — закрыто вручную; ✓ — открыто вручную. Записи клиентов учитываются отдельно.</p>`}else if(page==='durations'){h='<h2>Продолжительность услуг</h2>'+services.map((s,i)=>`<label>${esc(s)}<select onchange="changeDuration(${i},this.value)">${[20,30,40,45,50,60,75,90,105,120].map(n=>`<option ${durations[i]===n?'selected':''} value="${n}">${n} минут</option>`).join('')}</select></label>`).join('')+'<p class="small">Обязательный перерыв: 20 минут.</p>'}else if(page==='done'){h='<h2>✓ Запись создана</h2><p>Она появится в разделе «Мои записи».</p><button class="wide" onclick="goto(\'my\')">Посмотреть запись</button>'}el().innerHTML=h}
function setDay(d){day=d;selected='';render()}function setAdminDay(d){adminDay=d;render()}function getOwner(){let id=localStorage.getItem('dm_owner');if(!id){id='guest-'+Math.random().toString(36).slice(2);localStorage.setItem('dm_owner',id)}return id}function book(){let name=document.getElementById('clientName').value.trim();if(!name){alert('Укажите имя');return}if(!selected||!free(day,selected,service)){alert('Время уже недоступно');render();return}bookings.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name,owner:getOwner(),day,time:selected,service});save();goto('done')}function cancel(id){if(!confirm('Отменить запись?'))return;bookings=bookings.filter(b=>b.id!==id);save();render()}function toggleDay(){closed=closed.includes(adminDay)?closed.filter(x=>x!==adminDay):[...closed,adminDay];save();render()}function toggleSlot(t){const k=adminDay+'|'+t;blocked=blocked.includes(k)?blocked.filter(x=>x!==k):[...blocked,k];save();render()}function changeDuration(i,v){durations[i]=Number(v);save();render()}render();
</script></body></html>
