<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Дзен Массаж — запись к Екатерине</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#47384b;background:#fbf8fb}*{box-sizing:border-box}body{margin:0}main{max-width:550px;margin:auto;min-height:100dvh;background:#fff;box-shadow:0 0 35px #77527c13}.hero{padding:28px 24px 26px;background:linear-gradient(120deg,#f0dff2,#fff0e5);border-radius:0 0 25px 25px}.lotus{font-size:27px}.brand{font-size:25px;font-weight:800;letter-spacing:1px;color:#865193}.sub{margin-top:6px;color:#765f79;font-size:14px}.content{padding:26px 22px 38px}h2{font-size:21px;margin:0 0 13px}p{line-height:1.5;color:#6b5d6c}button,select,input{font:inherit}button{cursor:pointer}.btn{display:block;width:100%;padding:15px 12px;margin:11px 0;border-radius:14px;border:1px solid #dbc8de;background:#fff;color:#694b70;font-weight:600}.primary{background:#9864a4;color:#fff;border-color:#9864a4}.btn:disabled{opacity:.5;cursor:not-allowed}.back{border:0;background:transparent;color:#8b5a94;font-size:15px;padding:10px 0 20px}.item{border:1px solid #e7dbe8;border-radius:15px;padding:15px;margin:11px 0;background:#fff}.item strong{display:block;margin-bottom:7px}.muted{font-size:13px;color:#887889}.pill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.pill{border:1px solid #d9c4df;border-radius:12px;background:#fff;padding:13px 3px;color:#64446e}.pill.selected{background:#9864a4;color:white}.pill:disabled{opacity:.3}.field{width:100%;padding:14px;border:1px solid #dac8df;border-radius:12px;margin:7px 0 12px;background:white;color:#49364f}label{display:block;margin-top:14px;font-weight:600}.notice{font-size:12px;line-height:1.5;padding:12px;border-radius:12px;background:#f8f2f9;color:#786a7d;margin-top:20px}.success{border:1px solid #c6dfcb;background:#f1faf3;padding:15px;border-radius:14px}.empty{padding:22px 10px;text-align:center;color:#8a7c8b}.divider{height:1px;background:#eee4ee;margin:18px 0}.danger{color:#a34c69}.hidden{display:none}</style></head><body><main><header class="hero"><div><span class="lotus">✿</span> <span class="brand">ДЗЕН МАССАЖ</span></div><div class="sub">Екатерина · запись на массаж</div></header><section class="content" id="app"><h2>Уважаемые клиенты, здравствуйте!</h2><p>Меня зовут Екатерина. Приглашаю вас уделить время себе, расслабиться и восстановить силы.</p><button class="btn primary" onclick="go('services')">📅 Записаться</button><button class="btn" onclick="go('mine')">Мои записи</button><button class="btn" onclick="go('catalog')">Услуги</button><button class="btn" onclick="go('contact')">Связаться с Екатериной</button><p class="muted">Для работы кнопок откройте страницу на сайте GitHub Pages, а не в предварительном просмотре файла.</p></section></main><script>
'use strict';
const services=['Проработка мышц','Релакс-массаж','Лимфодренажный массаж','Баночный массаж','Массаж шейно-воротниковой зоны','Массаж бамбуковым веником','Другие техники'];
const demoDurations=[60,60,75,45,30,60,60];
const times=['10:00','11:30','13:00','14:30','16:00','17:30'];
const key='dzen-massage-client-demo-v2';
let bookings=[];try{bookings=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(bookings))bookings=[]}catch{bookings=[]}
let screen='home',service=-1,day='',time='',name='';const root=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem(key,JSON.stringify(bookings))}
function dateKey(d){const x=new Date(d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}
function days(){return Array.from({length:14},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);return {value:dateKey(d),label:new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'short'}).format(d)}})}
function go(s){screen=s;render();window.scrollTo(0,0)}
function back(){go('home')}
function footer(){return '<div class="notice">Демонстрационная версия. Записи сохраняются только в этом браузере и не отправляются Екатерине. Свободные часы и длительности сейчас примерные. Для настоящей записи потребуется подключение Telegram и сервера.</div>'}
function render(){let html='';if(screen!=='home')html='<button class="back" onclick="back()">← Главное меню</button>';
if(screen==='home'){html+='<h2>Уважаемые клиенты, здравствуйте!</h2><p>Меня зовут Екатерина. Приглашаю вас уделить время себе, расслабиться и восстановить силы.</p><button class="btn primary" onclick="go(\'services\')">📅 Записаться</button><button class="btn" onclick="go(\'mine\')">Мои записи</button><button class="btn" onclick="go(\'catalog\')">Услуги</button><button class="btn" onclick="go(\'contact\')">Связаться с Екатериной</button>'}
if(screen==='services'||screen==='catalog'){html+='<h2>'+(screen==='catalog'?'Услуги':'Выберите услугу')+'</h2>';services.forEach((s,i)=>html+='<button class="btn" onclick="pickService('+i+')">'+esc(s)+' →</button>');if(screen==='catalog')html+='<p class="muted">Продолжительность и стоимость уточняются у Екатерины.</p>'}
if(screen==='booking'){html+='<h2>'+esc(services[service])+'</h2><p class="muted">Выберите удобный день и время. Это пример расписания для проверки интерфейса.</p><label for="day">Дата</label><select class="field" id="day" onchange="changeDay(this.value)">'+days().map(d=>'<option value="'+d.value+'" '+(d.value===day?'selected':'')+'>'+esc(d.label)+'</option>').join('')+'</select><label>Время</label><div class="pill-grid">'+times.map(t=>'<button class="pill '+(t===time?'selected':'')+'" onclick="chooseTime(\''+t+'\')">'+t+'</button>').join('')+'</div><p class="muted">Между сеансами предусмотрен перерыв 20 минут. В демоверсии общая занятость разных клиентов не синхронизируется.</p><label for="name">Ваше имя</label><input class="field" id="name" maxlength="80" placeholder="Как к вам обращаться" value="'+esc(name)+'" oninput="name=this.value"><button class="btn primary" onclick="confirmBooking()">Подтвердить демозапись</button>'}
if(screen==='mine'){html+='<h2>Мои записи</h2>';if(!bookings.length)html+='<div class="empty">Пока записей нет</div>';else bookings.forEach(b=>html+='<div class="item"><strong>'+esc(b.service)+'</strong><div>'+esc(b.day)+' · '+esc(b.time)+'</div><div class="muted">'+esc(b.name)+'</div><button class="btn danger" onclick="cancelBooking(\''+esc(b.id)+'\')">Отменить запись</button></div>')}
if(screen==='contact'){html+='<h2>Связаться с Екатериной</h2><p>Уточнить услуги и время сеанса можно по телефону.</p><a class="btn primary" style="text-align:center;text-decoration:none" href="tel:+79991031077">📞 +7 999 103-10-77</a>'}
if(screen==='success'){html+='<div class="success"><h2>Демозапись создана</h2><p>Она сохранена только на этом устройстве. Екатерина уведомления не получит.</p></div><button class="btn primary" onclick="go(\'mine\')">Мои записи</button>'}
root.innerHTML=html+footer()}
function pickService(i){service=i;day=days()[0].value;time='';go('booking')}
function changeDay(d){day=d;time='';render()}
function chooseTime(t){time=t;render()}
function confirmBooking(){const el=document.getElementById('name');name=el.value.trim();if(!time){alert('Выберите время');return}if(!name){alert('Укажите имя');el.focus();return}bookings.push({id:String(Date.now())+Math.random().toString(36).slice(2),service:services[service],day,time,name});persist();go('success')}
function cancelBooking(id){if(!confirm('Отменить эту демозапись?'))return;bookings=bookings.filter(b=>b.id!==id);persist();render()}
render();
</script></body></html>
